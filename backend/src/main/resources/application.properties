# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update 
# Use 'validate' in production
spring.main.allow-circular-references=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Email config with default values if env vars are missing
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# JWT Security Configuration
# ===============================
# Secret key for JWT signing (minimum 256 bits/32 chars)
# Generate strong secret: openssl rand -base64 32
app.jwtSecret=${JWT_SECRET:defaultStrongSecretKeyAtLeast32CharactersLong123!}

# JWT expiration time in milliseconds (24 hours)
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Refresh token expiration (7 days)
app.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ===============================
# Application Security
# ===============================
# Password reset token expiration (1 hour)
app.passwordResetTokenExpirationMs=3600000

# Email verification code expiration (10 minutes)
app.verificationCodeExpirationMs=600000

# ===============================
# File Upload Configuration
# ===============================
app.user.profile.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Server Configuration
# ===============================
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-stacktrace=never 
# Disable in production

# ===============================
# CORS Configuration
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cors.max-age=3600
